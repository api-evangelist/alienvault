aid: alienvault
name: AlienVault
description: >-
  AlienVault is the security company behind the Open Threat Exchange (OTX), one of the
  largest open threat-intelligence communities in the world. OTX lets security
  practitioners and researchers create and share "pulses" — curated collections of
  indicators of compromise (IOCs) such as malicious IPs, domains, hostnames, URLs, file
  hashes, and CVEs — and consume that shared intelligence to automatically update their
  defensive infrastructure. The OTX DirectConnect API provides programmatic access to
  subscribed pulses, indicator detail lookups across multiple facets (general, geo,
  malware, passive DNS, reputation, URL lists), pulse and user search, and indicator
  submission for analysis. Authentication is via an X-OTX-API-KEY header. AlienVault was
  acquired by AT&T in 2018, becoming AT&T Cybersecurity, and OTX now operates under the
  LevelBlue brand. An official Python SDK (OTXv2) is published on PyPI and GitHub.
